<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body {
    background-color: #050505;
    color: #e0e0e0;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  /* The Draggable Module Container */
  .module-window {
    background: #111;
    border: 1px solid #333;
    width: 350px;
    box-shadow: 10px 10px 0px rgba(0, 255, 100, 0.1);
    position: absolute;
    /* Hardware snap effect */
    transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  }

  /* The Header Bar */
  .module-header {
    background: #222;
    padding: 10px;
    font-size: 12px;
    font-weight: bold;
    color: #00ff64;
    cursor: grab;
    display: flex;
    justify-content: space-between;
    letter-spacing: 2px;
  }

  .module-header:active {
    cursor: grabbing;
  }

  /* The Tracklist */
  .tracklist {
    list-style: none;
    padding: 20px;
    margin: 0;
  }

  .track {
    padding: 10px 0;
    font-size: 14px;
    cursor: pointer;
    position: relative;
    color: #888;
    transition: color 0.1s;
  }

  /* The Hover Glitch Effect - Vicious, not viscous */
  .track:hover {
    color: #fff;
    text-shadow: 
      2px 0px 1px #ff003c, 
      -2px 0px 1px #00eaff;
    animation: glitch-anim 0.2s infinite;
  }

  @keyframes glitch-anim {
    0% { transform: translate(0) }
    20% { transform: translate(-2px, 1px) }
    40% { transform: translate(-2px, -1px) }
    60% { transform: translate(2px, 1px) }
    80% { transform: translate(2px, -1px) }
    100% { transform: translate(0) }
  }

  .status-dot {
    height: 8px;
    width: 8px;
    background-color: #ff003c;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 10px #ff003c;
  }
</style>
</head>
<body>

  <div class="module-window" id="tracklist-module">
    <div class="module-header">
      <span>0CROSS_OS // TRACKS</span>
      <span class="status-dot"></span>
    </div>
    <ul class="tracklist">
      <li class="track">01. HERE (DEMO)</li>
      <li class="track">02. AURA (DEMO)</li>
      <li class="track">03. DRACULA</li>
      <li class="track">04. WAY PAST COOL</li>
      <li class="track">05. BATTERY DRAINED</li>
      <li class="track">06. MELT FOREVER</li>
    </ul>
  </div>

</body>
</html>
